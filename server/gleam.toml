name = "server"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
shared = { path = "../shared" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
dot_env = ">= 1.3.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
stratus = ">= 3.0.0 and < 4.0.0"
# Use this fork for gleam_erlang 1.x support (upstream requires ~> 0.24).
# Pin its 0.4.0 revision, which also allows gleam_stdlib 1.x.
carpenter = { git = "https://github.com/ghivert/carpenter.git", ref = "dcaadb1d00cc12f23c81c98ccba2a438936a8d77" }
# Temporary fork allowing gleam_stdlib 1.x; return to Hex after an upstream release.
# https://github.com/distrill/glight/pull/5
glight = { git = "https://github.com/ocapmycap/glight.git", ref = "378533d17c21958d51949a339cc8dea060ff8864" }
gleam_regexp = ">= 1.1.1 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
exception = ">= 2.1.1 and < 3.0.0"
