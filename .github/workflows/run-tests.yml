name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env: # Define global variables
  OTP_VERSION: "29.1.1"
  GLEAM_VERSION: "1.19.2"
  REBAR3_VERSION: "3.27.0"
  NODE_VERSION: "24.22.1"

jobs:
  shared-tests:
    name: Shared Tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        target: [erlang, javascript]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (JS target only)
        if: matrix.target == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          version-type: strict

      - name: Run Shared Tests
        run: |
          cd shared
          gleam deps download
          if [ "${{ matrix.target }}" = "javascript" ]; then
            gleam test --target javascript
          else
            gleam test --target erlang
          fi
          gleam format --check src test

      - name: Check Lockfiles
        run: git diff --exit-code -- '**/manifest.toml' '**/package-lock.json'

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          version-type: strict

      - name: Run Client Tests
        run: |
          cd client
          gleam deps download
          gleam test
          gleam format --check src test

      - name: Check Lockfiles
        run: git diff --exit-code -- '**/manifest.toml' '**/package-lock.json'

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          version-type: strict

      # - name: Set environment variables from secrets
      #   run: |
      #       cd server
      #       echo "COIN_MARKET_CAP_API_KEY=${{ secrets.COIN_MARKET_CAP_API_KEY }}" >> .env
      #   shell: bash

      - name: Run Server Tests
        run: |
          cd server
          gleam deps download
          gleam test
          gleam format --check src test

      - name: Check Lockfiles
        run: git diff --exit-code -- '**/manifest.toml' '**/package-lock.json'

  docker-build:
    name: Docker Build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build --progress=plain --tag rates:ci .
